<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bancada de runtime</title>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 16px;
        background: #f5f6f2;
        color: #1b1b1b;
      }
      pre {
        white-space: pre-wrap;
        background: #fff;
        padding: 12px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h1>Bancada de runtime (desenvolvimento)</h1>
    <p>
      Mesmo ONNX e pré/pós-processamento do produto. Parâmetros por URL:
      <code
        >?configs=wasm,webgpu,webgpu-io,webgpu-graph&amp;runs=15&amp;mode=hybrid&amp;frame=1920x1080</code
      >. Sem imagem escolhida, usa um quadro sintético.
    </p>
    <input id="file" type="file" accept="image/*" />
    <button id="run" type="button">Medir</button>
    <pre id="result">aguardando</pre>
    <p><a id="download" hidden>Baixar resultado (JSON)</a></p>
    <script type="module" src="./runtime.ts"></script>
  </body>
</html>
