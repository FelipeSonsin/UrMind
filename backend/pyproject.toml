[project]
name = "urmind"
version = "0.1.0"
description = "UrMind — relatos de problemas urbanos com revisão humana"
requires-python = ">=3.12,<3.13"
# Dependências do serviço de relatos e revisão.
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "httpx>=0.27,<1",  # JWKS do Supabase Auth e Storage API
  "jinja2>=3.1,<4",
  "numpy>=2.3,<3",
  "pillow>=10.4,<12",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",  # validação ES256 dos JWT do Supabase Auth
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",  # upload de foto (UploadFile)
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
fair = ["qrcode[pil]==8.2"]
photo-reference-export = [
  # Export only of explicitly registered reference models; no training.
  "open_clip_torch==3.3.0",
  "timm==1.0.30",
  "ftfy==6.3.1",
  "regex==2026.9.10",
  "safetensors==0.8.0",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["templates/*.j2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "architecture: regras que protegem as decisões estruturais do projeto",
  "integration: testes que exigem PostgreSQL/PostGIS real",
  "live: testes opt-in que acessam serviços públicos externos",
]

[tool.ruff]
# Cache do Ruff permanece junto ao projeto Python.
cache-dir = ".ruff_cache"
exclude = ["third_party", ".venv*"]
line-length = 100
target-version = "py312"

[tool.mypy]
# O mypy deve ser executado a partir de backend; assim o cache não polui a raiz.
cache_dir = ".mypy_cache"
