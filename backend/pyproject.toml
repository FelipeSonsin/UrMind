[project]
name = "urmind"
version = "0.1.0"
description = "UrMind — detecção rastreável de problemas urbanos em vias públicas"
requires-python = ">=3.12,<3.13"
# Somente o que o código usa hoje. Cada nova dependência do MASTER_PLAN §28
# (PyTorch, YOLOX, ONNX Runtime, OpenCV, Pillow, XGBoost...) entra no passo que
# realmente a exercita, nunca antes.
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "httpx>=0.27,<1",  # JWKS do Supabase Auth e Storage API
  "jinja2>=3.1,<4",
  "numpy>=2.3,<3",
  "pillow>=10.4,<12",
  "psycopg[binary,pool]>=3.2,<4",
  # Project Sidewalk e RampNet publicam Parquet com a imagem dentro da linha;
  # sem isto a camada de dataset não lê essas duas fontes. A faixa acompanha
  # `scripts/datasets/requirements.txt`, que fixa 25.0.1: as duas listas
  # descrevem o mesmo ambiente e não podem divergir.
  "pyarrow>=17,<26",
  "pydantic>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",  # validação ES256 dos JWT do Supabase Auth
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",  # upload de foto (UploadFile)
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
fair = ["qrcode[pil]==8.2"]
photo-reference-export = [
  # Export only of explicitly registered reference models; no training.
  "open_clip_torch==3.3.0",
  "timm==1.0.30",
  "ftfy==6.3.1",
  "regex==2026.9.10",
  "safetensors==0.8.0",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
ml = [
  "loguru==0.7.3",
  "onnx==1.19.1",  # export do modelo promovido (§9)
  "onnxruntime==1.23.2",  # inferência do Worker (§9)
  "opencv-python==4.14.0.94",
  "packaging==26.3",
  "psutil==7.1.0",
  "pycocotools==2.0.11",
  "torch==2.11.0+cu128",
  "torchvision==0.26.0+cu128",
]
mlops = [
  "dvc==3.67.1",
  "mlflow-skinny==3.16.0",
]
data-platforms = [
  "huggingface-hub>=0.27,<2",
]
future-vision = [
  # Metadado opcional apenas; não instalar durante o treino YOLOX ativo.
  "timm>=1,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["templates/*.j2"]

[tool.setuptools.packages.find]
where = [".", "third_party/YOLOX"]
include = ["app*", "yolox*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "architecture: regras que protegem as decisões estruturais do projeto",
  "integration: testes que exigem PostgreSQL/PostGIS real",
  "live: testes opt-in que acessam serviços públicos externos",
]

[tool.ruff]
# Cache do Ruff permanece junto ao projeto Python.
cache-dir = ".ruff_cache"
exclude = ["third_party", ".venv*"]
line-length = 100
target-version = "py312"

[tool.mypy]
# O mypy deve ser executado a partir de backend; assim o cache não polui a raiz.
cache_dir = ".mypy_cache"
