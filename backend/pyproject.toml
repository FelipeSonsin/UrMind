[project]
name = "urmind"
version = "0.1.0"
description = "UrMind — detecção rastreável de problemas urbanos em vias públicas"
requires-python = ">=3.12"
# Somente o que o código usa hoje. Cada nova dependência do MASTER_PLAN §28
# (PyTorch, YOLOX, ONNX Runtime, OpenCV, Pillow, XGBoost...) entra no passo que
# realmente a exercita, nunca antes.
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "jinja2>=3.1,<4",
  "pillow>=10.4,<12",
  "psycopg[binary,pool]>=3.2,<4",
  # Project Sidewalk e RampNet publicam Parquet com a imagem dentro da linha;
  # sem isto a camada de dataset não lê essas duas fontes. A faixa acompanha
  # `scripts/datasets/requirements.txt`, que fixa 25.0.1: as duas listas
  # descrevem o mesmo ambiente e não podem divergir.
  "pyarrow>=17,<26",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",  # TestClient do FastAPI
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["templates/*.j2"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "architecture: regras que protegem as decisões estruturais do projeto",
  "integration: testes que exigem PostgreSQL/PostGIS real",
]

[tool.ruff]
line-length = 100
target-version = "py312"
